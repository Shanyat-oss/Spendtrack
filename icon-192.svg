<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <style>@import url('https://cdn.jsdelivr.net/npm/@fontsource/poppins@5/600.css');</style>
    <linearGradient id="highlight" x1="0" y1="0" x2="0" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="0" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0.5" stop-color="black" stop-opacity="0"/>
      <stop offset="1" stop-color="black" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="dollarShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="192" height="192" rx="42" fill="#C05C2A"/>
  <rect width="192" height="192" rx="42" fill="url(#highlight)"/>
  <rect width="192" height="192" rx="42" fill="url(#shadow)"/>
  <text x="96" y="96" text-anchor="middle" dominant-baseline="central"
        font-family="'Poppins', -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-weight="600" font-size="119" fill="white" filter="url(#dollarShadow)">$</text>
</svg>
