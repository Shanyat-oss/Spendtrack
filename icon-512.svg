<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- SpendTrack, maskable. Paths only: no webfont, no network fetch.
       Marked "any maskable", so every mark sits inside the central 80% safe zone
       (radius 205 from centre) and the ground bleeds to the full edge. -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#A5F0D1"/>
      <stop offset="0.5" stop-color="#ACE4DE"/>
      <stop offset="1" stop-color="#ABD4EF"/>
    </linearGradient>
    <radialGradient id="lensBody" cx="0.34" cy="0.24" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.34"/>
    </radialGradient>
    <linearGradient id="lensRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#field)"/>

  <circle cx="256" cy="256" r="148" fill="url(#lensBody)"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#lensRim)" stroke-width="6"/>
  <path d="M167 205a108 108 0 0 1 98-62" fill="none" stroke="#FFFFFF" stroke-opacity="0.85"
        stroke-width="17" stroke-linecap="round"/>

  <g fill="none" stroke="#07695F" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M303 322c0-22-22-37-47-37s-47 12-47 35c0 44 96 37 96 84 0 25-22 39-49 39s-49-15-49-37"
          transform="translate(0,-100)"/>
    <path d="M256 148v216"/>
  </g>
</svg>
