<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>@import url('https://cdn.jsdelivr.net/npm/@fontsource/poppins@5/600.css');</style>
    <linearGradient id="highlight" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0.5" stop-color="black" stop-opacity="0"/>
      <stop offset="1" stop-color="black" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="dollarShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#C05C2A"/>
  <rect width="512" height="512" rx="112" fill="url(#highlight)"/>
  <rect width="512" height="512" rx="112" fill="url(#shadow)"/>
  <text x="256" y="256" text-anchor="middle" dominant-baseline="central"
        font-family="'Poppins', -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-weight="600" font-size="317" fill="white" filter="url(#dollarShadow)">$</text>
</svg>
